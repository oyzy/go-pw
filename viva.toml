[app]
name = "GoKeep"
id = "dev.gokeep.app"
version = "0.1.1"
executable = "GoKeep"
package = "."
# 1024x1024 PNG: viva build turns it into the .exe icon and the window icon.
icon = "build/appicon.png"

[build]
out = "bin"

[mac]
category = "public.app-category.productivity"

[windows]
publisher = "GoKeep"

[linux]
category = "Utility"
comment = "Password manager with its own encrypted database format"
maintainer = "oyzy <oyzy@users.noreply.github.com>"
homepage = "https://github.com/oyzy/go-pw"
keywords = ["password", "manager", "vault", "encryption"]
