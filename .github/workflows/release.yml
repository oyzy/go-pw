name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: |
          go test ./... -count=1
          node tools/i18n-check.mjs
          go run github.com/vivaui/viva/cmd/viva vet

      - name: Package
        run: |
          args=(package --target darwin --arch arm64 --format zip,dmg)
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] &&
             [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            args+=(--notarize)
          else
            echo "::warning::Apple signing credentials are incomplete; publishing an unsigned macOS build"
          fi
          go run github.com/vivaui/viva/cmd/viva "${args[@]}"

      - name: Verify signed packages when available
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          zip="$(find bin -maxdepth 1 -name '*-darwin-arm64.zip' -print -quit)"
          test -n "$zip"
          scratch="$(mktemp -d)"
          unzip -q "$zip" -d "$scratch"
          app="$(find "$scratch" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          dmg="$(find bin -maxdepth 1 -name '*-darwin-arm64.dmg' -print -quit)"
          test -n "$dmg"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg"
          else
            echo "::warning::The macOS build is signed but was not notarized"
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            bin/*-darwin-arm64.zip
            bin/*-darwin-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check Windows signing mode
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_SIGN_COMMAND) {
            throw "Set either WINDOWS_CERTIFICATE or WINDOWS_SIGN_COMMAND, not both"
          }
          if ($env:WINDOWS_CERTIFICATE -and -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_CERTIFICATE is set without WINDOWS_CERTIFICATE_PASSWORD"
          }
          if (-not $env.WINDOWS_SIGN_COMMAND -and -not $env.WINDOWS_CERTIFICATE) {
            Write-Output "::warning::Windows signing credentials are missing; publishing unsigned Windows packages"
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: |
          go test ./... -count=1
          node tools/i18n-check.mjs
          go run github.com/vivaui/viva/cmd/viva vet

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
            $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS"
            if (-not (Test-Path (Join-Path $nsis "makensis.exe"))) {
              throw "makensis was not installed"
            }
            $nsis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Package
        run: >
          go run github.com/vivaui/viva/cmd/viva package
          --target windows
          --arch amd64
          --format nsis,zip

      - name: Verify Authenticode signatures
        if: ${{ env.WINDOWS_SIGN_COMMAND != '' || (env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '') }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem bin\*-windows-amd64.zip | Select-Object -First 1
          if (-not $zip) { throw "The Windows package was not created" }
          $setup = Get-ChildItem bin\*-windows-amd64-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "The Windows installer was not created" }
          $scratch = Join-Path $env:RUNNER_TEMP "signed-windows"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $scratch -Force
          $exe = Get-ChildItem $scratch -Recurse -Filter GoKeep.exe | Select-Object -First 1
          if (-not $exe) { throw "GoKeep.exe is missing from the Windows package" }
          foreach ($file in @($exe.FullName, $setup.FullName)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed for $file`: $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Output "Authenticode signer for $file`: $($signature.SignerCertificate.Subject)"
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            bin/*-windows-amd64-setup.exe
            bin/*-windows-amd64.zip
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Install Viva runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libvulkan1 libxcb1
          sudo ldconfig

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: |
          go test ./... -count=1
          node tools/i18n-check.mjs
          go run github.com/vivaui/viva/cmd/viva vet

      - name: Package
        run: |
          go run github.com/vivaui/viva/cmd/viva package \
            --target linux \
            --arch amd64 \
            --format tar.gz,deb \
            --no-sign

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            bin/*-linux-amd64.tar.gz
            bin/*_amd64.deb
          if-no-files-found: error

  feed:
    name: Update feed
    needs:
      - macos
      - windows
      - linux
    runs-on: ubuntu-latest
    env:
      VIVA_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify update signing key
        run: |
          if [ -z "${VIVA_UPDATE_KEY:-}" ]; then
            echo "Missing UPDATE_SIGNING_KEY secret" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate signed update feed
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run github.com/vivaui/viva/cmd/viva feed \
            -version "$version" \
            -dir release-assets \
            -base-url "https://github.com/oyzy/go-pw/releases/download/${GITHUB_REF_NAME}" \
            -channel stable \
            -notes "https://github.com/oyzy/go-pw/releases/tag/${GITHUB_REF_NAME}" \
            -out release-assets/latest.json \
            -valid-for 2160h
          test -s release-assets/latest.json
          test -s release-assets/latest.json.sig

      - name: Upload update feed
        uses: actions/upload-artifact@v4
        with:
          name: release-feed
          path: |
            release-assets/latest.json
            release-assets/latest.json.sig
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - macos
      - windows
      - linux
      - feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "GoKeep $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "GoKeep $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md \
              --verify-tag
          fi
