name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: |
          go test ./... -count=1
          node tools/i18n-check.mjs
          go run github.com/vivaui/viva/cmd/viva vet

      - name: Package
        run: |
          go run github.com/vivaui/viva/cmd/viva package \
            --target darwin \
            --arch arm64 \
            --format zip,dmg \
            --no-sign

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            bin/*-darwin-arm64.zip
            bin/*-darwin-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: |
          go test ./... -count=1
          node tools/i18n-check.mjs
          go run github.com/vivaui/viva/cmd/viva vet

      - name: Package
        run: >
          go run github.com/vivaui/viva/cmd/viva package
          --target windows
          --arch amd64
          --format zip
          --no-sign

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: bin/*-windows-amd64.zip
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Install Viva runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libvulkan1 libxcb1
          sudo ldconfig

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: |
          go test ./... -count=1
          node tools/i18n-check.mjs
          go run github.com/vivaui/viva/cmd/viva vet

      - name: Package
        run: |
          go run github.com/vivaui/viva/cmd/viva package \
            --target linux \
            --arch amd64 \
            --format tar.gz,deb \
            --no-sign

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            bin/*-linux-amd64.tar.gz
            bin/*_amd64.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - macos
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "GoKeep $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md \
              --verify-tag
          fi
