<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GoKeep</title>
    <link rel="icon" type="image/png" href="/icon.png"/>
    <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<div id="app">
    <div class="titlebar" id="titlebar">
        <div class="titlebar-drag">
            <img class="titlebar-icon" src="/icon.png" alt=""/>
            <span class="titlebar-title" id="titlebar-title">GoKeep</span>
        </div>
        <div class="titlebar-drag titlebar-spacer"></div>
        <div class="titlebar-buttons">
            <button class="titlebar-button" id="window-minimize" data-i18n-title="titlebar.minimize">
                <svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg>
            </button>
            <button class="titlebar-button" id="window-maximize" data-i18n-title="titlebar.maximize">
                <svg class="glyph-maximize" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg>
                <svg class="glyph-restore" viewBox="0 0 12 12"><rect x="1.5" y="3.5" width="7" height="7"/><path d="M3.5 3.5V1.5h7v7h-2"/></svg>
            </button>
            <button class="titlebar-button close" id="window-close" data-i18n-title="titlebar.close">
                <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg>
            </button>
        </div>
    </div>
    <div class="menubar" id="menubar"></div>
    <div class="toolbar" id="toolbar">
        <button class="tbtn" data-cmd="file:new" data-i18n-title="toolbar.newDatabase" data-shortcut="Ctrl+N">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="toolbar.newDatabase">新建</span>
        </button>
        <button class="tbtn" data-cmd="file:open" data-i18n-title="toolbar.open" data-shortcut="Ctrl+O">
            <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/></svg><span data-i18n="toolbar.open">打开</span>
        </button>
        <button class="tbtn" data-cmd="file:save" data-i18n-title="toolbar.save" data-shortcut="Ctrl+S">
            <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/></svg><span data-i18n="toolbar.save">保存</span>
        </button>
        <button class="tbtn" data-cmd="file:lock" data-i18n-title="toolbar.lock" data-shortcut="Ctrl+L">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-i18n="toolbar.lock">锁定</span>
        </button>

        <div class="separator"></div>

        <button class="tbtn" data-cmd="edit:new-entry" data-i18n-title="toolbar.newEntry" data-shortcut="Ctrl+Shift+N" data-requires-vault>
            <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M9 11h6"/></svg><span data-i18n="toolbar.newEntry">新建条目</span>
        </button>
        <button class="tbtn" data-cmd="edit:new-group" data-i18n-title="toolbar.newGroup" data-shortcut="Ctrl+Shift+G" data-requires-vault>
            <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/><path d="M12 12v4M10 14h4"/></svg><span data-i18n="toolbar.newGroup">新建分组</span>
        </button>
        <button class="tbtn" data-cmd="edit:duplicate" data-i18n-title="toolbar.duplicate" data-shortcut="Ctrl+K" data-requires-vault>
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h9"/></svg><span data-i18n="toolbar.duplicate">复制</span>
        </button>
        <button class="tbtn" data-cmd="edit:delete" data-i18n-title="toolbar.delete" data-shortcut="Delete" data-requires-vault>
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span data-i18n="toolbar.delete">删除</span>
        </button>

        <div class="separator"></div>

        <button class="tbtn" data-cmd="edit:copy-user" data-i18n-title="toolbar.copyUser" data-shortcut="Ctrl+B" data-requires-vault>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span data-i18n="toolbar.copyUser">用户名</span>
        </button>
        <button class="tbtn" data-cmd="edit:copy-password" data-i18n-title="toolbar.copyPassword" data-shortcut="Ctrl+C" data-requires-vault>
            <svg viewBox="0 0 24 24"><path d="M15 7a5 5 0 1 0-4.6 5H13l2 2 2-2 2 2v-3h-3z"/></svg><span data-i18n="toolbar.copyPassword">密码</span>
        </button>
        <button class="tbtn" data-cmd="edit:copy-url" data-i18n-title="toolbar.copyUrl" data-shortcut="Ctrl+U" data-requires-vault>
            <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1"/><path d="M14 10a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1"/></svg><span data-i18n="toolbar.copyUrl">网址</span>
        </button>
        <button class="tbtn" data-cmd="edit:open-url" data-i18n-title="toolbar.openUrl" data-shortcut="Ctrl+Shift+U" data-requires-vault>
            <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5H5V6h5"/></svg><span data-i18n="toolbar.openUrl">打开</span>
        </button>

        <div class="separator"></div>

        <button class="tbtn" data-cmd="tools:generator" data-i18n-title="toolbar.generator" data-shortcut="Ctrl+G" data-requires-vault>
            <svg viewBox="0 0 24 24"><path d="M5 12h4l2-5 2 10 2-5h4"/></svg><span data-i18n="toolbar.generator">生成器</span>
        </button>
        <button class="tbtn" data-cmd="tools:db-settings" data-i18n-title="toolbar.settings" data-requires-vault>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span data-i18n="toolbar.settings">设置</span>
        </button>

        <div class="spacer"></div>

        <input type="search" id="search" data-i18n-placeholder="toolbar.search" placeholder="搜索 (Ctrl+F)" style="width: 220px" disabled/>
        <button class="tbtn" data-cmd="edit:find" data-i18n-title="toolbar.searchOptions" data-requires-vault>
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        </button>
    </div>

    <div class="main">
        <div class="pane pane-tree">
            <div class="pane-head">
                <strong id="tree-title" data-i18n="tree.title">分组</strong>
            </div>
            <div class="pane-body" id="tree"></div>
        </div>

        <div class="pane pane-list">
            <div class="pane-head">
                <strong id="list-title" data-i18n="list.title">条目</strong>
                <span class="hint" id="list-count"></span>
                <div class="spacer" style="flex:1"></div>
                <span class="hint" id="list-hint"></span>
            </div>
            <div class="pane-body" style="padding:0">
                <table class="entries">
                    <thead>
                    <tr>
                        <th data-sort="title" data-i18n="list.columnTitle">标题</th>
                        <th data-sort="user" data-i18n="list.columnUser">用户名</th>
                        <th data-sort="url" data-i18n="list.columnUrl">网址</th>
                        <th data-sort="quality" data-i18n="list.columnQuality">强度</th>
                        <th data-sort="modified" data-i18n="list.columnModified">修改时间</th>
                    </tr>
                    </thead>
                    <tbody id="entries"></tbody>
                </table>
            </div>
        </div>

        <div class="pane pane-detail" id="detail-pane">
            <div class="pane-head">
                <strong data-i18n="detail.header">条目详情</strong>
                <div style="flex:1"></div>
                <button class="btn ghost" id="edit-entry" data-i18n="detail.edit" disabled>编辑</button>
            </div>
            <div class="pane-body" id="detail">
                <div class="detail-empty" data-i18n="detail.select">选择一个条目查看详情</div>
            </div>
        </div>
    </div>

    <div class="status">
        <span id="status-db" data-i18n="status.notOpen">未打开数据库</span>
        <span id="status-counts"></span>
        <span class="grow" style="flex:1"></span>
        <span id="status-warning"></span>
        <span id="status-clipboard"></span>
        <span id="status-version">GoKeep</span>
    </div>
</div>

<div id="lock-screen" class="lock"></div>
<div id="modals"></div>
<div class="toasts" id="toasts"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
